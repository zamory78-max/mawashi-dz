name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json', 'sw.js', 'icon-*.png', '.github/workflows/build-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets
        run: |
          mkdir -p build/www
          cp index.html manifest.json icon-192.png icon-512.png build/www/
          # service worker is not needed inside the native app
          sed -i "s#navigator.serviceWorker.register('sw.js')#Promise.resolve()#" build/www/index.html

      - name: Create Capacitor Android project
        working-directory: build
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/share@6 @capacitor/filesystem@6
          cat > capacitor.config.json <<'JSON'
          { "appId": "dz.mawashi.app", "appName": "مواشي الجزائر", "webDir": "www",
            "android": { "allowMixedContent": false } }
          JSON
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M

      - name: Apply app icon
        working-directory: build/android/app/src/main/res
        run: |
          rm -rf mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; sz=${d##*:}
            convert ../../../../../../icon-512.png -resize ${sz}x${sz} mipmap-$n/ic_launcher.png
            cp mipmap-$n/ic_launcher.png mipmap-$n/ic_launcher_round.png
            rm -f mipmap-$n/ic_launcher_foreground.png
          done

      - name: Build APK (installable, signed with debug key)
        working-directory: build/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp build/android/app/build/outputs/apk/debug/app-debug.apk mawashi-dz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mawashi-dz-apk
          path: mawashi-dz.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest mawashi-dz.apk --title "مواشي الجزائر (APK)" --notes "آخر نسخة APK — حمّل الملف وثبّته على الهاتف." --target "$GITHUB_SHA"
